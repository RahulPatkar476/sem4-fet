<!DOCTYPE html>
<html>
<head>
<style>
  /* The Container Card */
  .project-card {
    width: 320px;
    background: #ffffff;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    overflow: hidden;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    transition: transform 0.3s ease;
    border: 1px solid #eee;
  }

  /* Hover effect to make it feel interactive */
  .project-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 15px 35px rgba(0,0,0,0.15);
  }

  /* The Screenshot Area */
  .project-img {
    width: 100%;
    height: 180px;
    object-fit: cover; /* This clips the image perfectly without stretching */
    display: block;
  }

  /* Text and Button Area */
  .project-content {
    padding: 20px;
    text-align: center;
  }

  .project-title {
    margin: 0 0 10px 0;
    color: #333;
    font-size: 1.25rem;
  }

  /* The "View Source" Button */
  .view-source-btn {
    display: inline-block;
    background-color: #24292e; /* GitHub Brand Color */
    color: white;
    padding: 10px 20px;
    text-decoration: none;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    transition: background 0.2s ease;
  }

  .view-source-btn:hover {
    background-color: #444;
  }
</style>
</head>
<body>

  <div class="project-card">
    <img src="images/rep.png" alt="Project Screenshot" class="project-img">
    
    <div class="project-content">
      <h2 class="project-title">My Assignment</h2>
      
      <a href="https://github.com/RahulPatkar476/sem4-fet" 
         target="_blank" 
         class="view-source-btn">
         View Source on GitHub
      </a>
    </div>
  </div>

</body>
</html>
