<div class="form-wrapper">
    <h2>Tech Preferences Survey</h2>
    <form id="techForm">
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="userName" placeholder="Your Name">
            <small class="error-msg" id="nameError"></small>
        </div>

        <div class="form-group">
            <label>Primary Role</label>
            <select id="userRole">
                <option value="">--Select One--</option>
                <option value="student">Student</option>
                <option value="dev">Developer</option>
                <option value="designer">Designer</option>
            </select>
        </div>

        <div class="form-group">
            <label>Experience Level</label>
            <div class="options">
                <input type="radio" name="exp" value="Beginner"> Beginner
                <input type="radio" name="exp" value="Pro"> Pro
            </div>
            <small class="error-msg" id="radioError"></small>
        </div>

        <div class="form-group">
            <label>Languages Known</label>
            <div class="options">
                <input type="checkbox" name="skill" value="JS"> JavaScript
                <input type="checkbox" name="skill" value="PY"> Python
                <input type="checkbox" name="skill" value="CSS"> CSS
            </div>
        </div>

        <button type="submit">Submit Data</button>
    </form>
</div>
