<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Feedback Form</title>
    <link rel="stylesheet" href="2_form.css">
</head>
<body>
    <div class="form-wrapper">
        <h2>Send us Feedback</h2>
        <form id="feedbackForm">
            <div class="form-group">
                <label for="userName">Full Name</label>
                <input type="text" id="userName" placeholder="Enter your name">
                <small class="error-msg" id="nameError"></small>
            </div>

            <div class="form-group">
                <label for="userMail">E-mail</label>
                <input type="email" id="userMail" placeholder="example@mail.com">
                <small class="error-msg" id="mailError"></small>
            </div>

            <div class="form-group">
                <label for="details">Details</label>
                <textarea id="details" rows="4"></textarea>
                <small class="error-msg" id="detailsError"></small>
            </div>

            <button type="submit">Display Results</button>
        </form>

        <div id="resultsContainer" class="results-box" style="display: none;">
            <h3>Submitted Data:</h3>
            <div id="displayArea"></div>
        </div>
    </div>
    <script src="2_form.js"></script>
</body>
</html>
