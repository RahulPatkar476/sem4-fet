<!DOCTYPE html>
<html>
<head>
    <title>Rahul's Profile</title>
</head>
<body>

    <h1>Rahul Patkar</h1>
    <h3 id="role-display">Developer</h3>
    <p>I am an BSDK!!!!.</p>

    <button onclick="changeRole()">Change Role</button>

    <script>
        function changeRole() {
            const roleElement = document.getElementById("role-display");
            const oldRole = roleElement.innerText;
            
            const newRole = prompt("Enter a new role:", oldRole);

            if (newRole === null || newRole.trim() === "" || newRole === oldRole) {
                alert("No changes were made.);
            } else {
                roleElement.innerHTML = newRole;
                alert("Roles changed successfully! You are now a " + newRole);
            }
        }
    </script>

</body>
</html>
