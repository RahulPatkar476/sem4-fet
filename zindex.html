<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-Index Layer Toggle</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 30px;
        }

        .container {
            max-width: 400px;
            margin: auto;
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
        }

        /* Buttons */
        button {
            padding: 10px 15px;
            margin: 5px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            font-size: 14px;
            background-color: #333;
            color: white;
            transition: 0.3s;
        }

        button:hover {
            background-color: #555;
        }

        /* Content Box */
        .content-box {
            position: relative;
            width: 100%;
            height: 200px;
            margin-top: 20px;
            border: 3px solid #333;
            overflow: hidden;
            border-radius: 10px;
            background: white;
        }

        /* Layers */
        .layer {
            position: absolute;
            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            display: none;

            align-items: center;
            justify-content: center;

            color: white;
            font-size: 24px;
            font-weight: bold;

            opacity: 0;
            transition: opacity 0.4s ease;
        }

        /* Individual Colors */
        #layer1 {
            background-color: tomato;
        }

        #layer2 {
            background-color: dodgerblue;
        }

        #layer3 {
            background-color: mediumseagreen;
        }

        /* Active Layer */
        .active {
            display: flex;
            opacity: 1;
            z-index: 10;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Z-Index Layer Switcher</h2>

        <!-- Buttons -->
        <button onclick="showLayer('layer1')">Show Red</button>
        <button onclick="showLayer('layer2')">Show Blue</button>
        <button onclick="showLayer('layer3')">Show Green</button>

        <!-- Layer Container -->
        <div class="content-box">

            <div id="layer1" class="layer active">
                LAYER 1 (RED)
            </div>

            <div id="layer2" class="layer">
                LAYER 2 (BLUE)
            </div>

            <div id="layer3" class="layer">
                LAYER 3 (GREEN)
            </div>

        </div>

    </div>

    <script>

        function showLayer(id) {

            // Get all layers
            let layers = document.getElementsByClassName("layer");

            // Remove active class from all
            for (let i = 0; i < layers.length; i++) {
                layers[i].classList.remove("active");
            }

            // Add active class to selected layer
            document.getElementById(id).classList.add("active");
        }

    </script>

</body>
</html>
